  socialIcons = [
    {name = "github", url = "https://github.com/m-movahedi"},
    {name = "twitter", url = "https://x.com/m_movahedi_"},
    {name = "linkedin", url = "https://www.linkedin.com/in/m-movahedi"},
    {name = "google", url = "https://scholar.google.com/citations?user=BXiu1y0AAAAJ&hl=en"},
    {name = "researchgate", url = "https://www.researchgate.net/profile/Mohammad-Movahedi-3"},
    {name = "goodreads", url = "https://www.goodreads.com/m_movahedi"},
    {name = "youtube", url = "https://www.youtube.com/channel/UCEYpMTO20lSZoYd8zP52bRA"},
    {name = "email", url = "mailto:eng.mohammadmovahedi@gmail.com"}
  ]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]

