{{ define "main" }}

<h1>{{ .Title }}</h1>

<div class="blog-grid">

  {{ range .Pages }}

  <a class="blog-card" href="{{ .RelPermalink }}">

    <div class="blog-card-content">

      <h2>{{ .Title }}</h2>

      <p class="blog-date">
        {{ .Date.Format "Jan 2, 2006" }}
      </p>

      {{ with .Summary }}
      <p>{{ . }}</p>
      {{ end }}

    </div>

  </a>

  {{ end }}

</div>

{{ end }}
